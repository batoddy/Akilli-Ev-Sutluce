; ============================================================================
;  Sütlüce Akıllı Ev — 3 rol, tek kod tabanı
;  Flash:  pio run -e kapi   -t upload
;          pio run -e kamera -t upload
;          pio run -e salon  -t upload
;  Seri monitör: pio device monitor
; ============================================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DMQTT_KEEPALIVE=30
    -DCORE_DEBUG_LEVEL=0

[env:kapi]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DROLE_KAPI
build_src_filter = +<*> -<roles/> +<roles/DoorRelay.cpp>

[env:salon]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DROLE_SALON
build_src_filter = +<*> -<roles/> +<roles/AcNode.cpp>
lib_deps =
    ${env.lib_deps}
    crankyoldgit/IRremoteESP8266@^2.8.6

[env:kamera]
board = esp32cam
build_flags =
    ${env.build_flags}
    -DROLE_KAMERA
    -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<roles/> +<roles/CamNode.cpp>
